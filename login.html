<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>تسجيل دخول الدكتور</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Cairo,sans-serif;background:#FAF8F3;color:#14161a;min-height:100vh;display:flex;flex-direction:column}
.bar{height:8px;background:linear-gradient(90deg,#C8102E 0 10%,#14161a 10% 40%,#fff 40% 60%,#0B6B3A 60%)}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:24px;background:repeating-linear-gradient(45deg,rgba(20,22,26,.04) 0 2px,transparent 2px 14px),repeating-linear-gradient(-45deg,rgba(20,22,26,.04) 0 2px,transparent 2px 14px)}
form{width:100%;max-width:420px;background:#fff;border:1px solid #E3DFD6;border-top:4px solid #0B6B3A;padding:40px 32px;display:flex;flex-direction:column;gap:20px;box-sizing:border-box}
h1{margin:4px 0 0;font-size:28px;font-weight:800;text-align:center}.u{color:#0B6B3A;font-weight:700;text-align:center}
label{font-weight:700;display:block;margin-bottom:8px}
input{width:100%;box-sizing:border-box;height:48px;padding:0 14px;border:1px solid #9a968c;border-radius:6px;font:16px Cairo}
button{height:52px;background:#14161a;color:#fff;border:0;border-radius:6px;font:800 17px Cairo;cursor:pointer}
#err{color:#C8102E;font-weight:700;min-height:1.4em;text-align:center}
</style></head><body><div class="bar"></div><main>
<form id="f"><div><div class="u">جامعة النجاح الوطنية</div><h1>نظام الحضور الذكي</h1></div>
<div><label for="u">البريد الإلكتروني / اسم المستخدم</label><input id="u" autocomplete="username" required></div>
<div><label for="p">كلمة المرور</label><input id="p" type="password" autocomplete="current-password" required></div>
<div id="err" role="alert"></div><button>تسجيل الدخول</button></form>
</main><script src="/js/login.js"></script></body></html>
